<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Shooter 3D</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div id="menu">
        <header>
            <h1>NEO SHOOTER <span>3D</span></h1>
            <p>ONLINE WORLD</p>
        </header>

        <div class="menu-card">
            <h2>Welcome</h2>
            <p id="serverStatus">Connecting to server...</p>

            <button id="playButton">PLAY</button>

            <div class="menu-buttons">
                <button data-panel="avatar">AVATAR</button>
                <button data-panel="events">EVENTS</button>
                <button data-panel="season">SEASON</button>
                <button data-panel="equipment">STYLE</button>
                <button data-panel="settings">SETTINGS</button>
                <button data-panel="updates">UPDATES</button>
            </div>

            <div id="menuPanel" hidden>
                <h3 id="panelTitle"></h3>
                <div id="panelContent"></div>
                <button id="closePanel">CLOSE</button>
            </div>
        </div>

        <footer>NEO SHOOTER 3D © 2026</footer>
    </div>

    <main id="game" hidden>
        <div id="gameInfo">
            <div id="playerInfo">Player</div>
            <div id="onlinePlayers">Online: 0</div>
            <div id="adminAnnouncement"></div>
            <button id="exitButton">EXIT</button>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/game.js"></script>

</body>
</html>
