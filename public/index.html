
<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Neo Shooter 3D</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #080d19;
  color: white;
  font-family: Arial, sans-serif;
}

#menu {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 5;
  background: #101b2cdd;
  padding: 12px;
  border: 1px solid #00d9ff;
  border-radius: 10px;
}

#status { color: #00eaff; }

#mobile {
  position: fixed;
  bottom: 25px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  z-index: 5;
  pointer-events: none;
}

.controls {
  display: grid;
  grid-template-columns: 55px 55px 55px;
  gap: 5px;
}

button {
  border: 1px solid #00d9ff;
  background: #10243bdd;
  color: white;
  border-radius: 12px;
  padding: 15px;
  font-size: 18px;
  touch-action: none;
}

#fire {
  width: 75px;
  height: 75px;
  border-radius: 50%;
}

#mobile button { pointer-events: auto; }

#start {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: #080d19cc;
  z-index: 10;
}

#start button {
  font-size: 20px;
  padding: 18px 35px;
}
</style>
</head>

<body>

<div id="menu">
  <b>NEO SHOOTER 3D</b><br>
  <span id="status">Jungiamasi...</span><br>
  Žaidėjai: <span id="count">1</span>
</div>

<div id="mobile">
  <div class="controls">
    <button data-key="w" style="grid-column:2">▲</button>
    <button data-key="a">◀</button>
    <button data-key="s">▼</button>
    <button data-key="d">▶</button>
  </div>
  <button id="fire">⚡</button>
</div>

<div id="start">
  <button id="startBtn">PRADĖTI ŽAISTI</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const socket = io();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080d19);
scene.fog = new THREE.Fog(0x080d19, 20, 100);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth / innerHeight, 0.1, 200
);

camera.position.set(0, 1.7, 5);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(
  new THREE.HemisphereLight(0x88ccff, 0x202030, 2)
);

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 10, 5);
scene.add(light);

// Arena
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({ color: 0x172337 })
);

floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const grid = new THREE.GridHelper(
  100, 50, 0x00d9ff, 0x263b55
);

grid.position.y = 0.02;
scene.add(grid);

// Buildings
for (let i = 0; i < 20; i++) {
  const h = 2 + Math.random() * 8;

  const block = new THREE.Mesh(
    new THREE.BoxGeometry(3, h, 3),
    new THREE.MeshStandardMaterial({
      color: 0x243b58,
      emissive: 0x071b30
    })
  );

  block.position.set(
    (Math.random() - 0.5) * 45,
    h / 2,
    (Math.random() - 0.5) * 45
  );

  scene.add(block);
}

// Player controls
const keys = {};
const others = {};
const speed = 0.12;

let yaw = 0;
let pitch = 0;
let lastSent = 0;

addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

document.getElementById("startBtn").onclick = () => {
  document.getElementById("start").style.display = "none";

  if (matchMedia("(pointer:fine)").matches) {
    renderer.domElement.requestPointerLock();
  }
};

// Desktop camera
addEventListener("mousemove", e => {
  if (document.pointerLockElement !== renderer.domElement) return;

  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;

  pitch = THREE.MathUtils.clamp(pitch, -1.4, 1.4);
});

// Mobile camera
let touching = false;
let previousX = 0;
let previousY = 0;

renderer.domElement.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) return;

  touching = true;
  previousX = e.touches[0].clientX;
  previousY = e.touches[0].clientY;
}, { passive: true });

renderer.domElement.addEventListener("touchmove", e => {
  if (!touching || e.touches.length !== 1) return;

  const t = e.touches[0];

  yaw -= (t.clientX - previousX) * 0.005;
  pitch -= (t.clientY - previousY) * 0.005;

  pitch = THREE.MathUtils.clamp(pitch, -1.4, 1.4);

  previousX = t.clientX;
  previousY = t.clientY;
}, { passive: true });

renderer.domElement.addEventListener("touchend", () => {
  touching = false;
});

// Mobile movement
document.querySelectorAll("[data-key]").forEach(btn => {
  const key = btn.dataset.key;

  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
  });

  ["pointerup", "pointerleave", "pointercancel"].forEach(event => {
    btn.addEventListener(event, () => keys[key] = false);
  });
});

// Other players
function makePlayer(color = 0xff33cc) {
  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 1.5, 0.5),
    new THREE.MeshStandardMaterial({
      color,
      emissive: color,
      emissiveIntensity: 0.15
    })
  );

  body.position.y = 0.75;
  group.add(body);
  scene.add(group);

  return group;
}

socket.on("connect", () => {
  document.getElementById("status").textContent = "Prisijungta!";
});

socket.on("disconnect", () => {
  document.getElementById("status").textContent = "Ryšys nutrūko";
});

function updateCount() {
  document.getElementById("count").textContent =
    Object.keys(others).length + 1;
}

socket.on("players", data => {
  Object.entries(data).forEach(([id, p]) => {
    if (id === socket.id) return;

    others[id] = makePlayer();
    others[id].position.set(p.x, 0, p.z);
  });

  updateCount();
});

socket.on("playerJoined", p => {
  if (p.id === socket.id) return;

  if (!others[p.id]) {
    others[p.id] = makePlayer();
  }

  updateCount();
});

socket.on("playerMoved", p => {
  if (!others[p.id]) {
    others[p.id] = makePlayer();
  }

  others[p.id].position.set(p.x, 0, p.z);
});

socket.on("playerLeft", id => {
  if (others[id]) {
    scene.remove(others[id]);
    delete others[id];
  }

  updateCount();
});

// Energy effect
document.getElementById("fire").onclick = () => {
  const orb = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0x00eaff })
  );

  const direction = new THREE.Vector3();
  camera.getWorldDirection(direction);

  orb.position.copy(camera.position);
  scene.add(orb);

  const start = performance.now();

  function animateOrb(now) {
    const elapsed = (now - start) / 1000;

    orb.position.addScaledVector(direction, 0.7);

    if (elapsed > 1.5) {
      scene.remove(orb);
      orb.geometry.dispose();
      orb.material.dispose();
      return;
    }

    requestAnimationFrame(animateOrb);
  }

  requestAnimationFrame(animateOrb);
};

// Main loop
function animate() {
  requestAnimationFrame(animate);

  const forward = new THREE.Vector3(
    -Math.sin(yaw), 0, -Math.cos(yaw)
  );

  const right = new THREE.Vector3(
    Math.cos(yaw), 0, -Math.sin(yaw)
  );

  if (keys.w) camera.position.addScaledVector(forward, speed);
  if (keys.s) camera.position.addScaledVector(forward, -speed);
  if (keys.a) camera.position.addScaledVector(right, -speed);
  if (keys.d) camera.position.addScaledVector(right, speed);

  camera.position.x = THREE.MathUtils.clamp(
    camera.position.x, -45, 45
  );

  camera.position.z = THREE.MathUtils.clamp(
    camera.position.z, -45, 45
  );

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const now = performance.now();

  if (socket.connected && now - lastSent > 50) {
    socket.emit("move", {
      x: camera.position.x,
      y: camera.position.y,
      z: camera.position.z
    });

    lastSent = now;
  }

  renderer.render(scene, camera);
}

animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
