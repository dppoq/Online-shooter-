<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Shooter 3D</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101525;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #menu {
            padding: 35px 15px;
        }

        h1 {
            color: #00d9ff;
        }

        button {
            padding: 13px 22px;
            margin: 6px;
            border: 0;
            border-radius: 8px;
            background: #00bde8;
            color: #07111c;
            font-weight: bold;
            cursor: pointer;
        }

        #game {
            display: none;
            width: 100%;
            height: 80vh;
            min-height: 400px;
            position: relative;
            overflow: hidden;
        }

        #gameInfo {
            position: absolute;
            z-index: 10;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        #gameInfo button {
            pointer-events: auto;
        }

        #status {
            color: #00e5ff;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>NEO SHOOTER 3D</h1>
        <p>Online 3D pasaulis</p>
        <button onclick="startGame()">PLAY</button>
        <p id="status">Jungiamasi prie serverio...</p>
    </div>

    <div id="game">
        <div id="gameInfo">
            <span id="playerCount">Žaidėjai: 1</span>
            <button onclick="exitGame()">EXIT</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        let socket = null;
        let started = false;

        function startGame() {
            if (started) return;

            socket = io();

            socket.on("connect", () => {
                started = true;
                document.getElementById("menu").style.display = "none";
                document.getElementById("game").style.display = "block";

                window.gameSocket = socket;
                window.dispatchEvent(
                    new CustomEvent("gameSocketReady", {
                        detail: socket
                    })
                );
            });

            socket.on("playersUpdate", players => {
                document.getElementById("playerCount").textContent =
                    "Žaidėjai: " + players.length;
            });

            socket.on("adminMessage", message => {
                alert(message);
            });

            socket.on("disconnect", () => {
                document.getElementById("status").textContent =
                    "Ryšys su serveriu nutrūko";
            });

            socket.on("connect_error", () => {
                document.getElementById("status").textContent =
                    "Nepavyko prisijungti prie serverio";
            });
        }

        function exitGame() {
            if (socket) {
                socket.disconnect();
                socket = null;
            }

            started = false;
            document.getElementById("game").style.display = "none";
            document.getElementById("menu").style.display = "block";
        }
    </script>

    <script type="module" src="/game.js"></script>

</body>
</html>
