
<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo Shooter 3D – Admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #080d18;
    color: #eafaff;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    color: #00eaff;
    text-align: center;
}

h2 {
    color: #00eaff;
    font-size: 19px;
}

.panel {
    background: #111c2e;
    border: 1px solid #17445c;
    border-radius: 12px;
    padding: 18px;
    margin: 15px 0;
}

input, textarea, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 7px;
    border: 1px solid #24536a;
    font-size: 15px;
}

input, textarea {
    background: #081321;
    color: white;
}

button {
    background: #00bcd4;
    color: #001018;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #55eaff;
}

.danger {
    background: #d93650;
    color: white;
}

.secondary {
    background: #263c55;
    color: white;
}

.hidden {
    display: none;
}

.status {
    padding: 12px;
    background: #081321;
    border-radius: 8px;
    margin-top: 10px;
    overflow-wrap: anywhere;
}

.player {
    padding: 12px;
    margin-top: 10px;
    background: #081321;
    border: 1px solid #24536a;
    border-radius: 8px;
}

.player button {
    margin-top: 8px;
}

.small {
    color: #9bb6c5;
    font-size: 13px;
}

#notice {
    margin-top: 12px;
    color: #55eaff;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="container">

<h1>NEO SHOOTER 3D</h1>
<p style="text-align:center">ADMINISTRATORIAUS VALDYMO SKYDAS</p>

<!-- LOGIN -->
<div class="panel" id="loginPanel">

<h2>Administratoriaus prisijungimas</h2>

<input
    id="username"
    type="text"
    placeholder="Administratoriaus vardas"
    autocomplete="username"
>

<input
    id="password"
    type="password"
    placeholder="Slaptažodis"
    autocomplete="current-password"
>

<button id="loginButton">PRISIJUNGTI</button>

<div id="loginMessage"></div>

</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

<div class="panel">

<h2>Serverio informacija</h2>

<div class="status">
    <p id="serverStatus">Tikrinama...</p>
    <p id="onlinePlayers">Žaidėjai: 0</p>
    <p id="serverName">Serveris: Neo Shooter 3D</p>
    <p id="maintenanceStatus">Priežiūra: išjungta</p>
</div>

<button id="refreshButton">ATNAUJINTI INFORMACIJĄ</button>

</div>

<!-- PLAYERS -->
<div class="panel">

<h2>Žaidėjų valdymas</h2>

<div id="playersList">
    Žaidėjų sąrašas dar neįkeltas.
</div>

<button id="playersButton">ATNAUJINTI ŽAIDĖJUS</button>

</div>

<!-- MESSAGE -->
<div class="panel">

<h2>Pranešimas žaidėjams</h2>

<textarea
    id="adminMessage"
    rows="3"
    maxlength="200"
    placeholder="Įrašyk pranešimą..."
></textarea>

<button id="sendMessageButton">SIŲSTI PRANEŠIMĄ</button>

</div>

<!-- SETTINGS -->
<div class="panel">

<h2>Serverio nustatymai</h2>

<label>Serverio pavadinimas</label>

<input
    id="settingName"
    type="text"
    maxlength="40"
    placeholder="Neo Shooter 3D"
>

<label>Didžiausias žaidėjų skaičius</label>

<input
    id="settingPlayers"
    type="number"
    min="1"
    max="100"
    value="20"
>

<label style="display:block;margin-top:15px">
    <input
        id="settingMaintenance"
        type="checkbox"
        style="width:auto"
    >
    Įjungti techninės priežiūros režimą
</label>

<button id="saveSettingsButton">IŠSAUGOTI NUSTATYMUS</button>

</div>

<!-- LOGOUT -->
<div class="panel">

<button class="danger" id="logoutButton">
    ATSIJUNGTI
</button>

</div>

</div>

<div id="notice"></div>

</div>

<script>
"use strict";

const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");
const notice = document.getElementById("notice");

let adminToken = sessionStorage.getItem("neoAdminToken");

function showNotice(message) {
    notice.textContent = message;
}

async function api(url, options = {}) {
    const headers = {
        ...(options.headers || {}),
        "Content-Type": "application/json"
    };

    if (adminToken) {
        headers.Authorization = "Bearer " + adminToken;
    }

    const response = await fetch(url, {
        ...options,
        headers
    });

    let data = {};

    try {
        data = await response.json();
    } catch {
        throw new Error("Serveris grąžino netinkamą atsakymą.");
    }

    if (!response.ok) {
        if (response.status === 401) {
            logout(false);
        }

        throw new Error(data.message || "Įvyko klaida.");
    }

    return data;
}

// LOGIN
async function login() {
    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    message.textContent = "Jungiamasi...";

    try {
        const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Prisijungti nepavyko.");
        }

        adminToken = data.token;

        sessionStorage.setItem(
            "neoAdminToken",
            adminToken
        );

        openAdmin();

    } catch (error) {
        message.textContent = error.message;
    }
}

// OPEN ADMIN
function openAdmin() {
    loginPanel.classList.add("hidden");
    adminPanel.classList.remove("hidden");

    showNotice("Administratoriaus skydas atidarytas.");

    loadStatus();
    loadPlayers();
}

// SERVER STATUS
async function loadStatus() {
    try {
        const data = await api("/api/status");

        document.getElementById("serverStatus").textContent =
            "Būsena: " + data.status;

        document.getElementById("onlinePlayers").textContent =
            "Žaidėjai: " + data.players;

        document.getElementById("serverName").textContent =
            "Serveris: " + data.settings.serverName;

        document.getElementById("maintenanceStatus").textContent =
            "Priežiūra: " +
            (data.settings.maintenance ? "įjungta" : "išjungta");

        document.getElementById("settingName").value =
            data.settings.serverName;

        document.getElementById("settingPlayers").value =
            data.settings.maxPlayers;

        document.getElementById("settingMaintenance").checked =
            data.settings.maintenance;

    } catch (error) {
        showNotice(error.message);
    }
}

// PLAYERS
async function loadPlayers() {
    const list = document.getElementById("playersList");

    list.textContent = "Kraunamas žaidėjų sąrašas...";

    try {
        const data = await api("/api/players");

        list.replaceChildren();

        if (!data.players || data.players.length === 0) {
            list.textContent = "Šiuo metu žaidėjų nėra.";
            return;
        }

        data.players.forEach(player => {
            const item = document.createElement("div");
            item.className = "player";

            const name = document.createElement("strong");
            name.textContent = player.username;

            const id = document.createElement("p");
            id.className = "small";
            id.textContent = "ID: " + player.id;

            const kickButton = document.createElement("button");
            kickButton.className = "danger";
            kickButton.textContent = "ATJUNGTI ŽAIDĖJĄ";

            kickButton.addEventListener("click", () => {
                kickPlayer(player.id);
            });

            item.append(name, id, kickButton);
            list.appendChild(item);
        });

    } catch (error) {
        list.textContent = error.message;
    }
}

// KICK PLAYER
async function kickPlayer(id) {
    if (!confirm("Ar tikrai nori atjungti šį žaidėją?")) {
        return;
    }

    try {
        await api("/api/admin/ban", {
            method: "POST",
            body: JSON.stringify({ id })
        });

        showNotice("Žaidėjas atjungtas.");

        loadPlayers();
        loadStatus();

    } catch (error) {
        showNotice(error.message);
    }
}

// SEND MESSAGE
async function sendMessage() {
    const message =
        document.getElementById("adminMessage").value.trim();

    if (!message) {
        showNotice("Įrašyk pranešimą.");
        return;
    }

    try {
        await api("/api/admin/message", {
            method: "POST",
            body: JSON.stringify({ message })
        });

        document.getElementById("adminMessage").value = "";

        showNotice("Pranešimas išsiųstas žaidėjams.");

    } catch (error) {
        showNotice(error.message);
    }
}

// SAVE SETTINGS
async function saveSettings() {
    const serverName =
        document.getElementById("settingName").value.trim();

    const maxPlayers = Number(
        document.getElementById("settingPlayers").value
    );

    const maintenance =
        document.getElementById("settingMaintenance").checked;

    if (
        !serverName ||
        !Number.isInteger(maxPlayers) ||
        maxPlayers < 1 ||
        maxPlayers > 100
    ) {
        showNotice("Patikrink serverio nustatymus.");
        return;
    }

    try {
        await api("/api/admin/settings", {
            method: "POST",
            body: JSON.stringify({
                serverName,
                maxPlayers,
                maintenance
            })
        });

        showNotice("Nustatymai išsaugoti.");

        loadStatus();

    } catch (error) {
        showNotice(error.message);
    }
}

// LOGOUT
async function logout(sendRequest = true) {
    if (sendRequest && adminToken) {
        try {
            await api("/api/admin/logout", {
                method: "POST"
            });
        } catch {
            // Token bus pašalintas ir vietoje.
        }
    }

    adminToken = null;

    sessionStorage.removeItem("neoAdminToken");

    adminPanel.classList.add("hidden");
    loginPanel.classList.remove("hidden");

    document.getElementById("password").value = "";

    showNotice("Atsijungta.");
}

// BUTTONS
document.getElementById("loginButton")
    .addEventListener("click", login);

document.getElementById("refreshButton")
    .addEventListener("click", loadStatus);

document.getElementById("playersButton")
    .addEventListener("click", loadPlayers);

document.getElementById("sendMessageButton")
    .addEventListener("click", sendMessage);

document.getElementById("saveSettingsButton")
    .addEventListener("click", saveSettings);

document.getElementById("logoutButton")
    .addEventListener("click", () => logout());

// ENTER LOGIN
document.getElementById("password")
    .addEventListener("keydown", event => {
        if (event.key === "Enter") {
            login();
        }
    });

// CHECK SAVED SESSION
if (adminToken) {
    openAdmin();
}
</script>

</body>
</html>
