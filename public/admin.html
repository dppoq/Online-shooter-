
<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEO SHOOTER – ADMIN</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#070b15;
 color:#eafaff;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;
 background:#101b2e;
 border-bottom:1px solid #00dfff;
}
header h1{color:#00eaff;margin:0}
.layout{display:flex;min-height:100vh}
nav{
 width:230px;
 background:#0c1424;
 padding:15px;
}
nav button{
 display:block;width:100%;
 margin:8px 0;padding:14px;
 background:#14243a;
 color:white;border:1px solid #174b65;
 border-radius:8px;text-align:left;
}
nav button:hover{background:#007f99}
main{flex:1;padding:20px;min-width:0}
.panel{
 background:#101b2e;
 border:1px solid #17445c;
 border-radius:12px;
 padding:20px;margin-bottom:18px;
}
h2{color:#00eaff}
button{
 cursor:pointer;font-weight:bold;
}
.action{
 width:100%;padding:14px;
 background:#00cce8;color:#001018;
 border:0;border-radius:8px;margin-top:10px;
}
.danger{background:#d93650;color:white}
input,textarea{
 width:100%;padding:12px;margin:8px 0;
 background:#071321;color:white;
 border:1px solid #24536a;border-radius:7px;
}
.hidden{display:none!important}
.stat{
 background:#081321;padding:15px;
 border-radius:8px;margin:8px 0;
}
.player{
 background:#081321;padding:12px;
 margin:10px 0;border-radius:8px;
}
#notice{color:#00eaff;margin:12px 0}
@media(max-width:650px){
 .layout{display:block}
 nav{width:100%;display:grid;grid-template-columns:1fr 1fr}
 nav button{text-align:center;font-size:12px}
 main{padding:12px}
}
</style>
</head>

<body>

<header>
<h1>NEO SHOOTER 3D</h1>
<p>ADMIN CONTROL CENTER</p>
</header>

<div class="layout">

<nav id="menu">
<button data-page="dashboard">📊 Dashboard</button>
<button data-page="game">🎮 Žaisti</button>
<button data-page="players">👥 Žaidėjai</button>
<button data-page="messages">📢 Pranešimai</button>
<button data-page="settings">⚙️ Nustatymai</button>
<button id="logoutButton" class="danger">🚪 Atsijungti</button>
</nav>

<main>

<div id="loginPanel" class="panel">
<h2>ADMIN LOGIN</h2>
<input id="username" placeholder="Administratoriaus vardas">
<input id="password" type="password" placeholder="Slaptažodis">
<button class="action" id="loginButton">PRISIJUNGTI</button>
<p id="loginMessage"></p>
</div>

<div id="adminPanel" class="hidden">

<section id="dashboard" class="page">
<div class="panel">
<h2>ADMIN DASHBOARD</h2>
<div class="stat" id="serverStatus">Serveris: tikrinama...</div>
<div class="stat" id="onlinePlayers">Žaidėjai: 0</div>
<div class="stat" id="serverName">Neo Shooter 3D</div>
<button class="action" id="refreshButton">ATNAUJINTI</button>
</div>
</section>

<section id="game" class="page hidden">
<div class="panel">
<h2>🎮 NEO SHOOTER 3D</h2>
<p>Atidaryk pagrindinį žaidimą ir žaisk kaip administratorius.</p>
<button class="action" id="playGameButton">PALEISTI ŽAIDIMĄ</button>
</div>
</section>

<section id="players" class="page hidden">
<div class="panel">
<h2>👥 ŽAIDĖJŲ VALDYMAS</h2>
<div id="playersList">Žaidėjų sąrašas neįkeltas.</div>
<button class="action" id="playersButton">ATNAUJINTI ŽAIDĖJUS</button>
</div>
</section>

<section id="messages" class="page hidden">
<div class="panel">
<h2>📢 PRANEŠIMAI</h2>
<textarea id="adminMessage" placeholder="Pranešimas žaidėjams"></textarea>
<button class="action" id="sendMessageButton">SIŲSTI</button>
</div>
</section>

<section id="settings" class="page hidden">
<div class="panel">
<h2>⚙️ SERVERIO NUSTATYMAI</h2>
<input id="settingName" placeholder="Serverio pavadinimas">
<input id="settingPlayers" type="number" min="1" max="100" value="20">
<label><input id="settingMaintenance" type="checkbox" style="width:auto"> Techninė priežiūra</label>
<button class="action" id="saveSettingsButton">IŠSAUGOTI</button>
</div>
</section>

</div>

<div id="notice"></div>

</main>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

let adminToken = sessionStorage.getItem("neoAdminToken");

function notice(message){
 $("notice").textContent=message;
}

function showPage(page){
 document.querySelectorAll(".page").forEach(p=>{
  p.classList.add("hidden");
 });
 $(page).classList.remove("hidden");
}

async function api(url,options={}){
 const headers={
  "Content-Type":"application/json",
  ...(options.headers||{})
 };
 if(adminToken) headers.Authorization="Bearer "+adminToken;

 const response=await fetch(url,{...options,headers});
 const data=await response.json();

 if(!response.ok) throw new Error(data.message||"Serverio klaida");
 return data;
}

async function login(){
 $("loginMessage").textContent="Jungiamasi...";
 try{
  const response=await fetch("/api/admin/login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    username:$("username").value.trim(),
    password:$("password").value
   })
  });

  const data=await response.json();
  if(!response.ok) throw new Error(data.message||"Klaida");

  adminToken=data.token;
  sessionStorage.setItem("neoAdminToken",adminToken);
  openAdmin();
 }catch(e){
  $("loginMessage").textContent=e.message;
 }
}

function openAdmin(){
 $("loginPanel").classList.add("hidden");
 $("adminPanel").classList.remove("hidden");
 showPage("dashboard");
 loadStatus();
 loadPlayers();
}

async function loadStatus(){
 try{
  const d=await api("/api/status");
  $("serverStatus").textContent="Serveris: "+d.status;
  $("onlinePlayers").textContent="Žaidėjai: "+d.players;
  $("serverName").textContent="Serveris: "+d.settings.serverName;
  $("settingName").value=d.settings.serverName;
  $("settingPlayers").value=d.settings.maxPlayers;
  $("settingMaintenance").checked=d.settings.maintenance;
 }catch(e){notice(e.message)}
}

async function loadPlayers(){
 try{
  const d=await api("/api/players");
  const list=$("playersList");
  list.replaceChildren();

  if(!d.players?.length){
   list.textContent="Žaidėjų nėra.";
   return;
  }

  d.players.forEach(player=>{
   const item=document.createElement("div");
   item.className="player";
   const name=document.createElement("strong");
   name.textContent=player.username;
   const kick=document.createElement("button");
   kick.className="action danger";
   kick.textContent="ATJUNGTI";
   kick.onclick=()=>kickPlayer(player.id);
   item.append(name,kick);
   list.append(item);
  });
 }catch(e){
  $("playersList").textContent=e.message;
 }
}

async function kickPlayer(id){
 if(!confirm("Atjungti žaidėją?"))return;
 try{
  await api("/api/admin/ban",{
   method:"POST",
   body:JSON.stringify({id})
  });
  notice("Žaidėjas atjungtas.");
  loadPlayers();
  loadStatus();
 }catch(e){notice(e.message)}
}

async function sendMessage(){
 const message=$("adminMessage").value.trim();
 if(!message)return notice("Įrašyk pranešimą.");
 try{
  await api("/api/admin/message",{
   method:"POST",
   body:JSON.stringify({message})
  });
  $("adminMessage").value="";
  notice("Pranešimas išsiųstas.");
 }catch(e){notice(e.message)}
}

async function saveSettings(){
 const serverName=$("settingName").value.trim();
 const maxPlayers=Number($("settingPlayers").value);
 const maintenance=$("settingMaintenance").checked;

 if(!serverName||!Number.isInteger(maxPlayers)||maxPlayers<1||maxPlayers>100){
  return notice("Netinkami nustatymai.");
 }

 try{
  await api("/api/admin/settings",{
   method:"POST",
   body:JSON.stringify({serverName,maxPlayers,maintenance})
  });
  notice("Nustatymai išsaugoti.");
  loadStatus();
 }catch(e){notice(e.message)}
}

async function logout(){
 try{
  if(adminToken) await api("/api/admin/logout",{method:"POST"});
 }catch(e){}
 adminToken=null;
 sessionStorage.removeItem("neoAdminToken");
 $("adminPanel").classList.add("hidden");
 $("loginPanel").classList.remove("hidden");
 $("password").value="";
}

document.querySelectorAll("[data-page]").forEach(button=>{
 button.addEventListener("click",()=>{
  showPage(button.dataset.page);
  if(button.dataset.page==="players")loadPlayers();
  if(button.dataset.page==="dashboard")loadStatus();
 });
});

$("loginButton").onclick=login;
$("refreshButton").onclick=loadStatus;
$("playersButton").onclick=loadPlayers;
$("sendMessageButton").onclick=sendMessage;
$("saveSettingsButton").onclick=saveSettings;
$("logoutButton").onclick=logout;

$("playGameButton").onclick=()=>{
 window.open("/","_blank");
};

if(adminToken)openAdmin();
</script>

</body>
</html>
