<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neo Shooter - Admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #07111f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 15px;
    background: #0b1d30;
    border-bottom: 1px solid #00cce8;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    margin: 0;
    color: #00eaff;
    font-size: 20px;
}

#loginScreen {
    width: 90%;
    max-width: 360px;
    margin: 80px auto;
    padding: 25px;
    background: #10243a;
    border: 1px solid #00cce8;
    border-radius: 12px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: #07111f;
    color: white;
    border: 1px solid #1689a5;
    border-radius: 6px;
}

button {
    padding: 11px;
    background: #00cce8;
    color: #001018;
    border: 0;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

#loginButton {
    width: 100%;
    margin-top: 12px;
}

#loginError {
    color: #ff7777;
    font-size: 13px;
}

#adminApp {
    display: none;
    padding: 12px;
}

.status-bar {
    padding: 10px;
    margin-bottom: 12px;
    background: #10243a;
    border-radius: 8px;
    font-size: 13px;
}

#game {
    position: relative;
    width: 100%;
    height: 65vh;
    min-height: 350px;
    overflow: hidden;
    background: #071426;
    border: 1px solid #00dfff;
    border-radius: 10px;
}

#game canvas {
    display: block;
}

#adminAnnouncement {
    margin-top: 10px;
    padding: 10px;
    background: #10243a;
    color: #00eaff;
    border-radius: 7px;
    min-height: 20px;
}

.admin-section {
    margin-top: 14px;
    padding: 14px;
    background: #10243a;
    border: 1px solid #1a4962;
    border-radius: 10px;
}

.admin-section h3 {
    margin-top: 0;
    color: #00eaff;
}

#playersList {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.player-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 9px;
    background: #071a2b;
    border-radius: 6px;
    font-size: 13px;
}

.player-item button {
    padding: 7px;
    font-size: 11px;
}

.message-row {
    display: flex;
    gap: 7px;
}

.message-row input {
    flex: 1;
    min-width: 0;
}

.message-row button {
    margin-top: 8px;
}

#logoutButton {
    background: #e34b5b;
    color: white;
}

@media (max-width: 600px) {
    header h2 {
        font-size: 17px;
    }

    #game {
        height: 58vh;
        min-height: 320px;
    }
}
</style>
</head>

<body>

<header>
    <h2>NEO SHOOTER 3D ADMIN</h2>
    <button id="logoutButton" style="display:none">
        LOGOUT
    </button>
</header>

<!-- LOGIN -->

<div id="loginScreen">

    <h2>Admin Login</h2>

    <input
        id="adminUsername"
        type="text"
        placeholder="Admin username"
        autocomplete="username"
    >

    <input
        id="adminPassword"
        type="password"
        placeholder="Admin password"
        autocomplete="current-password"
    >

    <button id="loginButton">
        LOGIN
    </button>

    <p id="loginError"></p>

</div>

<!-- ADMIN APP -->

<div id="adminApp">

    <div class="status-bar">
        <div id="serverStatus">
            Laukiama prisijungimo...
        </div>

        <div id="playerInfo">
            Žaidėjų serveryje: 0
        </div>
    </div>

    <!-- 3D GAME -->

    <div id="game"></div>

    <div id="adminAnnouncement">
        Serverio pranešimai bus rodomi čia.
    </div>

    <!-- PLAYERS -->

    <div class="admin-section">

        <h3>ONLINE PLAYERS</h3>

        <button id="refreshPlayers">
            REFRESH PLAYERS
        </button>

        <div id="playersList" style="margin-top:12px">
            Žaidėjų sąrašas tuščias.
        </div>

    </div>

    <!-- SERVER MESSAGE -->

    <div class="admin-section">

        <h3>SERVER MESSAGE</h3>

        <div class="message-row">
            <input
                id="serverMessage"
                type="text"
                placeholder="Write announcement..."
            >

            <button id="sendMessage">
                SEND
            </button>
        </div>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let adminToken = "";

async function adminApi(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + adminToken,
            ...(options.headers || {})
        }
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(data.message || data.error || "API klaida");
    }

    return data;
}

// =====================================
// LOGIN
// =====================================

document.getElementById("loginButton").onclick = login;

document.getElementById("adminPassword")
    .addEventListener("keydown", event => {
        if (event.key === "Enter") login();
    });

async function login() {
    const username =
        document.getElementById("adminUsername").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    const errorElement =
        document.getElementById("loginError");

    errorElement.textContent = "";

    if (!username || !password) {
        errorElement.textContent =
            "Įrašyk vartotojo vardą ir slaptažodį.";
        return;
    }

    try {
        const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const data = await response.json();

        if (!response.ok || !data.token) {
            throw new Error(
                data.message || data.error || "Neteisingi prisijungimo duomenys"
            );
        }

        adminToken = data.token;

        sessionStorage.setItem(
            "neoAdminToken",
            adminToken
        );

        window.NEO_ADMIN_MODE = true;
        window.NEO_ADMIN_TOKEN = adminToken;

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminApp").style.display = "block";
        document.getElementById("logoutButton").style.display = "block";

        if (typeof window.startNeoGame === "function") {
            window.startNeoGame();
        } else {
            document.getElementById("serverStatus").textContent =
                "Žaidimo failas dar neįkeltas. Perkrauk puslapį.";
        }

        loadPlayers();

    } catch (error) {
        errorElement.textContent = error.message;
    }
}

// =====================================
// PLAYERS
// =====================================

async function loadPlayers() {
    const list = document.getElementById("playersList");

    try {
        const data = await adminApi("/api/players");

        const players = Array.isArray(data)
            ? data
            : (data.players || []);

        list.innerHTML = "";

        if (!players.length) {
            list.textContent = "Prisijungusių žaidėjų nėra.";
            return;
        }

        players.forEach(player => {
            const item = document.createElement("div");
            item.className = "player-item";

            const name = document.createElement("span");
            name.textContent =
                player.username || player.name || "Player";

            const details = document.createElement("span");
            details.textContent =
                player.isAdmin ? "ADMIN" : "PLAYER";

            item.appendChild(name);
            item.appendChild(details);

            list.appendChild(item);
        });

    } catch (error) {
        list.textContent = "Nepavyko gauti žaidėjų: " + error.message;
    }
}

document.getElementById("refreshPlayers").onclick =
    loadPlayers;

// =====================================
// SERVER MESSAGE
// =====================================

document.getElementById("sendMessage").onclick =
    async function () {

        const input = document.getElementById("serverMessage");
        const message = input.value.trim();

        if (!message) return;

        try {
            await adminApi("/api/admin/message", {
                method: "POST",
                body: JSON.stringify({ message })
            });

            input.value = "";

            document.getElementById("adminAnnouncement")
                .textContent = message;

        } catch (error) {
            alert("Pranešimo išsiųsti nepavyko: " + error.message);
        }
    };

// =====================================
// LOGOUT
// =====================================

document.getElementById("logoutButton").onclick =
    async function () {

        try {
            await adminApi("/api/admin/logout", {
                method: "POST"
            });
        } catch (error) {
            // Sesija gali būti jau pasibaigusi.
        }

        sessionStorage.removeItem("neoAdminToken");

        window.NEO_ADMIN_MODE = false;
        window.NEO_ADMIN_TOKEN = "";

        location.reload();
    };
</script>

<script type="module" src="/game.js"></script>

</body>
</html>
