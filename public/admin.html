<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo Shooter 3D - ADMIN</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080d18;
    color: white;
    font-family: Arial, sans-serif;
}

button, input, select {
    padding: 11px;
    border: 1px solid #24536b;
    border-radius: 7px;
    background: #101e30;
    color: white;
    margin: 4px 0;
}

button {
    cursor: pointer;
    background: #007f9e;
}

button:hover {
    background: #00a9ce;
}

input {
    width: 100%;
}

header {
    padding: 15px;
    background: #101b2c;
    border-bottom: 2px solid #00d9ff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

h1 {
    margin: 0;
    color: #00eaff;
    font-size: 22px;
}

h2 {
    color: #00eaff;
    font-size: 18px;
}

.panel {
    background: #101b2c;
    border: 1px solid #21465c;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 12px;
}

#loginScreen {
    max-width: 380px;
    margin: 70px auto;
    padding: 20px;
}

#adminApp {
    display: none;
}

#layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 12px;
    padding: 12px;
}

#game {
    width: 100%;
    height: 65vh;
    min-height: 350px;
    background: #000;
    border: 2px solid #00d9ff;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
}

#game canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#menu {
    display: none;
}

#adminControls {
    max-height: 85vh;
    overflow-y: auto;
}

.status {
    color: #00ff99;
}

.player {
    padding: 9px;
    background: #0b1524;
    border: 1px solid #24445b;
    margin: 5px 0;
    border-radius: 6px;
    cursor: pointer;
}

.player.selected {
    border-color: #00eaff;
    background: #15364a;
}

.power {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 0;
}

.power input {
    width: auto;
}

#message {
    color: #ffcc55;
    min-height: 20px;
}

@media(max-width: 800px) {
    #layout {
        grid-template-columns: 1fr;
    }

    #game {
        height: 55vh;
    }

    #adminControls {
        max-height: none;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="panel">
    <h1>NEO SHOOTER ADMIN</h1>
    <p>Administratoriaus prisijungimas</p>

    <input id="username" placeholder="ADMIN username">
    <input id="password" type="password" placeholder="ADMIN password">

    <button onclick="login()" style="width:100%">
        PRISIJUNGTI
    </button>

    <p id="loginMessage"></p>
</div>

<!-- ADMIN APP -->

<div id="adminApp">

<header>
    <h1>NEO SHOOTER 3D ADMIN</h1>
    <div>
        <span class="status" id="serverStatus">Tikrinama...</span>
        <button onclick="logout()">Atsijungti</button>
    </div>
</header>

<div id="layout">

    <!-- GAME -->

    <main>
        <div class="panel">
            <h2>ŽAIDIMAS</h2>
            <div id="game"></div>

            <p id="playerInfo">Žaidimas ruošiamas...</p>
            <p id="onlinePlayers">Žaidėjų: 0</p>
            <p id="adminAnnouncement"></p>
        </div>

        <div class="panel">
            <h2>SERVERIO PRANEŠIMAS</h2>

            <input id="announcement"
                   placeholder="Įrašyk pranešimą visiems">

            <button onclick="sendMessage()">
                SIŲSTI PRANEŠIMĄ
            </button>

            <p id="message"></p>
        </div>
    </main>

    <!-- ADMIN CONTROLS -->

    <aside id="adminControls">

        <div class="panel">
            <h2>ADMIN GALIOS</h2>

            <div class="power">
                Invisible
                <input type="checkbox" id="invisible">
            </div>

            <div class="power">
                God Mode
                <input type="checkbox" id="godMode">
            </div>

            <div class="power">
                Fly
                <input type="checkbox" id="flying">
            </div>

            <label>Speed</label>
            <input type="range" id="speed"
                   min="0.5" max="5" step="0.5" value="1">

            <p id="speedValue">Speed: 1</p>

            <button onclick="applyPowers()">
                IŠSAUGOTI GALIAS
            </button>

            <button onclick="teleportPlayer()">
                TELEPORTUOTI Į CENTRĄ
            </button>
        </div>

        <div class="panel">
            <h2>ŽAIDĖJAI</h2>

            <button onclick="loadPlayers()">
                ATNAUJINTI SĄRAŠĄ
            </button>

            <div id="playersList">
                Žaidėjų nėra.
            </div>

            <button onclick="disconnectPlayer()"
                    style="background:#a52b38">
                ATJUNGTI PASIRINKTĄ ŽAIDĖJĄ
            </button>
        </div>

        <div class="panel">
            <h2>SERVERIO NUSTATYMAI</h2>

            <label>Serverio pavadinimas</label>
            <input id="serverName" value="Neo Shooter 3D">

            <label>Žaidėjų limitas</label>
            <input id="maxPlayers" type="number"
                   min="1" max="100" value="20">

            <div class="power">
                Techninė priežiūra
                <input type="checkbox" id="maintenance">
            </div>

            <button onclick="saveSettings()">
                IŠSAUGOTI NUSTATYMUS
            </button>
        </div>

    </aside>

</div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let adminToken = "";
let selectedPlayer = null;

async function api(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + adminToken,
            ...(options.headers || {})
        }
    });

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.message || "Įvyko klaida");
    }

    return data;
}

async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const output = document.getElementById("loginMessage");

    output.textContent = "Jungiamasi...";

    try {
        const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Prisijungti nepavyko");
        }

        adminToken = data.token;

        sessionStorage.setItem("neoAdminToken", adminToken);

        window.NEO_ADMIN_MODE = true;
        window.NEO_ADMIN_TOKEN = adminToken;

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminApp").style.display = "block";

        if (window.startNeoGame) {
            window.startNeoGame();
        }

        loadPlayers();
        loadSettings();
        checkStatus();

        setInterval(() => {
            if (adminToken) {
                loadPlayers();
                checkStatus();
            }
        }, 5000);

    } catch (error) {
        output.textContent = error.message;
    }
}

async function loadPlayers() {
    try {
        const data = await api("/api/players");
        const list = document.getElementById("playersList");

        list.innerHTML = "";

        document.getElementById("onlinePlayers").textContent =
            "Žaidėjų: " + data.players.length;

        if (!data.players.length) {
            list.textContent = "Žaidėjų nėra.";
            return;
        }

        data.players.forEach(player => {
            const item = document.createElement("div");

            item.className = "player" +
                (selectedPlayer === player.id ? " selected" : "");

            item.textContent =
                player.username + " (" + player.id.slice(0, 7) + ")";

            item.onclick = () => {
                selectedPlayer = player.id;

                document.getElementById("invisible").checked =
                    !!player.invisible;

                document.getElementById("godMode").checked =
                    !!player.godMode;

                document.getElementById("flying").checked =
                    !!player.flying;

                document.getElementById("speed").value =
                    player.speed || 1;

                document.getElementById("speedValue").textContent =
                    "Speed: " + (player.speed || 1);

                loadPlayers();
            };

            list.appendChild(item);
        });

    } catch (error) {
        document.getElementById("message").textContent = error.message;
    }
}

async function applyPowers() {
    if (!selectedPlayer) {
        alert("Pirmiausia pasirink žaidėją.");
        return;
    }

    try {
        await api("/api/admin/powers", {
            method: "POST",
            body: JSON.stringify({
                id: selectedPlayer,
                powers: {
                    invisible: document.getElementById("invisible").checked,
                    godMode: document.getElementById("godMode").checked,
                    flying: document.getElementById("flying").checked,
                    speed: Number(document.getElementById("speed").value)
                }
            })
        });

        document.getElementById("message").textContent =
            "Žaidėjo galios išsaugotos.";

        loadPlayers();

    } catch (error) {
        alert(error.message);
    }
}

async function teleportPlayer() {
    if (!selectedPlayer) {
        alert("Pirmiausia pasirink žaidėją.");
        return;
    }

    try {
        await api("/api/admin/teleport", {
            method: "POST",
            body: JSON.stringify({
                id: selectedPlayer,
                x: 0,
                y: 0,
                z: 0
            })
        });

        document.getElementById("message").textContent =
            "Žaidėjas perkeltas į centrą.";

        loadPlayers();

    } catch (error) {
        alert(error.message);
    }
}

async function disconnectPlayer() {
    if (!selectedPlayer) {
        alert("Pirmiausia pasirink žaidėją.");
        return;
    }

    try {
        await api("/api/admin/ban", {
            method: "POST",
            body: JSON.stringify({
                id: selectedPlayer
            })
        });

        selectedPlayer = null;
        loadPlayers();

    } catch (error) {
        alert(error.message);
    }
}

async function sendMessage() {
    const message = document.getElementById("announcement").value;

    try {
        await api("/api/admin/message", {
            method: "POST",
            body: JSON.stringify({ message })
        });

        document.getElementById("message").textContent =
            "Pranešimas išsiųstas.";

        document.getElementById("announcement").value = "";

    } catch (error) {
        alert(error.message);
    }
}

async function loadSettings() {
    try {
        const data = await api("/api/status");

        document.getElementById("serverName").value =
            data.settings.serverName;

        document.getElementById("maxPlayers").value =
            data.settings.maxPlayers;

        document.getElementById("maintenance").checked =
            data.settings.maintenance;

    } catch (error) {
        console.log(error.message);
    }
}

async function saveSettings() {
    try {
        await api("/api/admin/settings", {
            method: "POST",
            body: JSON.stringify({
                serverName: document.getElementById("serverName").value,
                maxPlayers: Number(document.getElementById("maxPlayers").value),
                maintenance: document.getElementById("maintenance").checked
            })
        });

        alert("Serverio nustatymai išsaugoti.");

    } catch (error) {
        alert(error.message);
    }
}

async function checkStatus() {
    try {
        const data = await api("/api/status");

        document.getElementById("serverStatus").textContent =
            "SERVERIS: " + data.status.toUpperCase();

    } catch (error) {
        document.getElementById("serverStatus").textContent =
            "SERVERIO KLAIDA";
    }
}

async function logout() {
    try {
        await api("/api/admin/logout", {
            method: "POST"
        });
    } catch (error) {
        console.log(error.message);
    }

    sessionStorage.removeItem("neoAdminToken");

    adminToken = "";
    window.NEO_ADMIN_MODE = false;
    window.NEO_ADMIN_TOKEN = "";

    location.reload();
}

document.getElementById("speed").addEventListener("input", event => {
    document.getElementById("speedValue").textContent =
        "Speed: " + event.target.value;
});
</script>

<script type="module" src="/game.js"></script>

</body>
</html>
