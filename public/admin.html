
<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1c">
<title>Neo Shooter 3D Admin</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 20px;
    background: #080d1c;
    color: white;
    font-family: Arial, sans-serif;
}
.container { max-width: 850px; margin: auto; }
h1 { color: #00d9ff; }
.card {
    background: #141f38;
    border: 1px solid #315b9d;
    border-radius: 12px;
    padding: 18px;
    margin: 15px 0;
}
input, button {
    padding: 12px;
    margin: 5px 0;
    border-radius: 7px;
    border: 1px solid #42649c;
}
input {
    width: 100%;
    background: #091326;
    color: white;
}
button {
    background: #087eb5;
    color: white;
    cursor: pointer;
    font-weight: bold;
}
button:hover { background: #159edb; }
.danger { background: #a52c45; }
.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 0;
    border-bottom: 1px solid #30405f;
}
#dashboard { display: none; }
#message { color: #00d9ff; }
#loginMessage { color: #ff7185; }
.game-button {
    display: inline-block;
    padding: 13px 20px;
    margin: 8px 0;
    border-radius: 7px;
    background: #087eb5;
    color: white;
    text-decoration: none;
    font-weight: bold;
}
@media (max-width: 600px) {
    body { padding: 12px; }
    .card { padding: 14px; }
}
</style>
</head>
<body>
<div class="container">
    <h1>NEO SHOOTER 3D</h1>
    <p>ADMIN CONTROL PANEL</p>

    <section id="login" class="card">
        <h2>Admin Login</h2>
        <input id="username" placeholder="Username" autocomplete="username">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password">
        <button id="loginButton">LOGIN</button>
        <p id="loginMessage"></p>
    </section>

    <section id="dashboard">
        <div class="card">
            <h2>Game</h2>
            <a class="game-button" href="/" target="_blank" rel="noopener">OPEN GAME</a>
        </div>

        <div class="card">
            <h2>Server Status</h2>
            <p id="status">Loading...</p>
            <button id="refreshButton">REFRESH</button>
        </div>

        <div class="card">
            <h2>Players</h2>
            <div id="players">Loading...</div>
        </div>

        <div class="card">
            <h2>Server Message</h2>
            <input id="announcement" maxlength="200" placeholder="Write a message">
            <button id="sendMessage">SEND MESSAGE</button>
        </div>

        <div class="card">
            <h2>Server Settings</h2>
            <input id="serverName" maxlength="40" placeholder="Server name">
            <input id="maxPlayers" type="number" min="1" max="100" value="20">
            <label>
                <input id="maintenance" type="checkbox" style="width:auto">
                Maintenance mode
            </label>
            <br>
            <button id="saveSettings">SAVE SETTINGS</button>
        </div>

        <div class="card">
            <button id="logoutButton" class="danger">LOGOUT</button>
        </div>
    </section>

    <p id="message"></p>
</div>

<script>
let token = "";
const $ = id => document.getElementById(id);

async function api(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            ...(token ? { Authorization: "Bearer " + token } : {}),
            ...(options.headers || {})
        }
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(data.message || data.error || "Request failed");
    }

    return data;
}

function showMessage(text) {
    $("message").textContent = text;
}

async function login() {
    $("loginMessage").textContent = "";

    try {
        const data = await api("/api/admin/login", {
            method: "POST",
            body: JSON.stringify({
                username: $("username").value,
                password: $("password").value
            })
        });

        token = data.token;
        $("login").style.display = "none";
        $("dashboard").style.display = "block";
        $("password").value = "";

        await refreshDashboard();
    } catch (error) {
        $("loginMessage").textContent = error.message;
    }
}

async function refreshDashboard() {
    try {
        const status = await api("/api/status");

        $("status").textContent =
            "Online players: " + status.players +
            " | Server: " + status.settings.serverName +
            " | Max players: " + status.settings.maxPlayers +
            " | Maintenance: " +
            (status.settings.maintenance ? "ON" : "OFF");

        $("serverName").value = status.settings.serverName;
        $("maxPlayers").value = status.settings.maxPlayers;
        $("maintenance").checked = status.settings.maintenance;

        const result = await api("/api/players");
        const players = result.players || [];
        const container = $("players");

        container.replaceChildren();

        if (players.length === 0) {
            container.textContent = "No players online.";
            return;
        }

        players.forEach(player => {
            const row = document.createElement("div");
            row.className = "row";

            const name = document.createElement("span");
            name.textContent =
                player.username + " (" + player.id + ")";

            const ban = document.createElement("button");
            ban.className = "danger";
            ban.textContent = "BLOCK";
            ban.addEventListener("click", () => blockPlayer(player.id));

            row.append(name, ban);
            container.appendChild(row);
        });
    } catch (error) {
        showMessage(error.message);
    }
}

async function blockPlayer(id) {
    if (!confirm("Block this player?")) return;

    try {
        await api("/api/admin/ban", {
            method: "POST",
            body: JSON.stringify({ id })
        });

        showMessage("Player blocked.");
        await refreshDashboard();
    } catch (error) {
        showMessage(error.message);
    }
}

async function sendMessage() {
    try {
        await api("/api/admin/message", {
            method: "POST",
            body: JSON.stringify({
                message: $("announcement").value
            })
        });

        $("announcement").value = "";
        showMessage("Message sent.");
    } catch (error) {
        showMessage(error.message);
    }
}

async function saveSettings() {
    try {
        const maxPlayers = Number($("maxPlayers").value);

        if (!Number.isInteger(maxPlayers) ||
            maxPlayers < 1 || maxPlayers > 100) {
            throw new Error("Max players must be between 1 and 100.");
        }

        await api("/api/admin/settings", {
            method: "POST",
            body: JSON.stringify({
                serverName: $("serverName").value,
                maxPlayers,
                maintenance: $("maintenance").checked
            })
        });

        showMessage("Settings saved.");
        await refreshDashboard();
    } catch (error) {
        showMessage(error.message);
    }
}

async function logout() {
    try {
        await api("/api/admin/logout", { method: "POST" });
    } catch (error) {
        // Session may already have expired.
    }

    token = "";
    $("dashboard").style.display = "none";
    $("login").style.display = "block";
    showMessage("Logged out.");
}

$("loginButton").addEventListener("click", login);
$("refreshButton").addEventListener("click", refreshDashboard);
$("sendMessage").addEventListener("click", sendMessage);
$("saveSettings").addEventListener("click", saveSettings);
$("logoutButton").addEventListener("click", logout);
</script>
</body>
</html>
